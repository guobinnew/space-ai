<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Space</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .splash-container {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }

      .splash-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, transparent 70%);
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }

      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        position: relative;
        z-index: 1;
      }

      .logo svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px rgba(79, 172, 254, 0.6));
      }

      .title {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #4facfe 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
      }

      .subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 2px;
        text-transform: uppercase;
        position: relative;
        z-index: 1;
      }

      .loading {
        margin-top: 32px;
        display: flex;
        gap: 8px;
        position: relative;
        z-index: 1;
      }

      .loading-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4facfe;
        animation: bounce 1.4s ease-in-out infinite;
      }

      .loading-dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loading-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
          <defs>
            <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#4facfe"/>
              <stop offset="100%" style="stop-color:#a78bfa"/>
            </linearGradient>
          </defs>
          <polygon 
            points="512,200 750,350 750,650 512,800 274,650 274,350" 
            fill="none" 
            stroke="url(#glow)" 
            stroke-width="24"
            stroke-linejoin="round"
          />
          <polygon 
            points="512,320 660,410 660,590 512,680 364,590 364,410" 
            fill="none" 
            stroke="url(#glow)" 
            stroke-width="16"
            stroke-linejoin="round"
            opacity="0.7"
          />
          <circle cx="512" cy="512" r="40" fill="url(#glow)"/>
        </svg>
      </div>
      <div class="title">Smart Space</div>
      <div class="subtitle">Loading...</div>
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </body>
</html>
