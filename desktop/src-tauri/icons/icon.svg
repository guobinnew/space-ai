<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    
    <!-- Glow gradient for the main shape -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    
    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#4facfe" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  
  <!-- Inner glow circle -->
  <circle cx="512" cy="512" r="300" fill="url(#innerGlow)"/>
  
  <!-- Main hexagon shape with glow -->
  <g filter="url(#shadow)">
    <!-- Outer hexagon -->
    <polygon 
      points="512,200 750,350 750,650 512,800 274,650 274,350" 
      fill="none" 
      stroke="url(#glow)" 
      stroke-width="24"
      stroke-linejoin="round"
    />
    
    <!-- Inner hexagon -->
    <polygon 
      points="512,320 660,410 660,590 512,680 364,590 364,410" 
      fill="none" 
      stroke="url(#glow)" 
      stroke-width="16"
      stroke-linejoin="round"
      opacity="0.7"
    />
    
    <!-- Center dot -->
    <circle cx="512" cy="512" r="40" fill="url(#glow)"/>
    
    <!-- Connection lines from center to vertices -->
    <line x1="512" y1="512" x2="512" y2="320" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    <line x1="512" y1="512" x2="660" y2="410" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    <line x1="512" y1="512" x2="660" y2="590" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    <line x1="512" y1="512" x2="512" y2="680" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    <line x1="512" y1="512" x2="364" y2="590" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    <line x1="512" y1="512" x2="364" y2="410" stroke="url(#glow)" stroke-width="8" opacity="0.6"/>
    
    <!-- Small dots at inner hexagon vertices -->
    <circle cx="512" cy="320" r="16" fill="#4facfe"/>
    <circle cx="660" cy="410" r="16" fill="#4facfe"/>
    <circle cx="660" cy="590" r="16" fill="#4facfe"/>
    <circle cx="512" cy="680" r="16" fill="#4facfe"/>
    <circle cx="364" cy="590" r="16" fill="#4facfe"/>
    <circle cx="364" cy="410" r="16" fill="#4facfe"/>
  </g>
</svg>
